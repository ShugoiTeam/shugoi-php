name: PHP SDK

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict --no-check-publish
      - run: composer lint
      - run: composer audit
      - run: vendor/bin/phpunit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-browser-transport.mjs scripts/test-pow-browser.mjs scripts/test-livewire-navigation.mjs
      - run: node scripts/test-obfuscator.cjs
